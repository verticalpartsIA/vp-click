# Serve o build estático do vpclick (Vite/React) atrás do Traefik já
# existente na VPS (rede `proxy`, resolver `letsencrypt`, HTTP→HTTPS
# automático — ver /docker/traefik/docker-compose.yml).
#
# Nenhum processo Node.js aqui: o app é 100% estático (o pipeline do
# GitHub Actions já faz `npm run build`), então nginx só serve arquivos —
# uso de CPU/RAM é irrisório.
#
# FASE DE TESTE: a regra do Host abaixo aponta pro subdomínio de teste
# (vpclick-teste.vpsistema.com). Na virada definitiva, troca só essa
# linha pra vpclick.vpsistema.com — nada mais muda.
services:
  vpclick:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.vpclick.rule=Host(`vpclick-teste.vpsistema.com`)
      - traefik.http.routers.vpclick.entrypoints=websecure
      - traefik.http.routers.vpclick.tls.certresolver=letsencrypt
      - traefik.http.services.vpclick.loadbalancer.server.port=80

networks:
  proxy:
    external: true
