worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Assets versionados por hash (ex.: index-B30tfByE.js) — podem ser
        # cacheados por muito tempo sem risco de servir versão velha.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # version.json é lido pelo app (versionCheck.ts) pra detectar deploy
        # novo — nunca pode vir de cache.
        location = /version.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        # Fallback de SPA: qualquer rota que não seja um arquivo real cai no
        # index.html (roteamento client-side do React). Sem cache, senão o
        # navegador prende numa versão antiga do HTML.
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
